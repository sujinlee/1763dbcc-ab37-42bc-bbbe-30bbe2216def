name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Lint, build, test and coverage
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Lint (dotnet format)
        run: dotnet format --verify-no-changes --no-restore

      - name: Build (analyzers, warnings as errors)
        run: dotnet build --configuration Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test --configuration Release --no-build
          --collect:"XPlat Code Coverage"
          --results-directory ./TestResults
          --logger "trx;LogFileName=test-results.trx"

      - name: Generate coverage report
        if: always()
        uses: danielpalme/ReportGenerator-GitHub-Action@5
        with:
          reports: TestResults/**/coverage.cobertura.xml
          targetdir: CoverageReport
          reporttypes: HtmlInline;MarkdownSummaryGithub;Cobertura

      - name: Add coverage to job summary
        if: always()
        run: cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results and coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-and-coverage
          path: |
            TestResults/**/*.trx
            CoverageReport/

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag lis .

      - name: Smoke test image
        run: |
          actual=$(docker run --rm lis "6 1 5 9 2")
          echo "Output: $actual"
          test "$actual" = "1 5 9"
